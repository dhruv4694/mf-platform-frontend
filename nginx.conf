server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all unknown paths
    # Without this, refreshing on /portfolio would return 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: no /api proxy block here.
    # On Railway (and any environment without a local Docker Compose network),
    # there is no "app" hostname for nginx to resolve. The frontend instead
    # calls the backend directly via the full public URL baked in at build time
    # through the VITE_API_URL environment variable (see api/client.js).
    # This proxy block only worked in local docker-compose fullstack mode,
    # where "app" was a real service name on the Compose network.

    # Cache static assets aggressively — Vite adds content hashes to filenames
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}